<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.home">LUXESTATE — Build Your Future</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="progress">
        <nav class="nav" id="nav">
            <a href="index.html" class="nav__logo">LUXESTATE</a>
            <ul class="nav__menu">
                <li><a href="index.html" class="nav__link nav__link--active" data-spy="top" data-i18n="nav.home">Home</a></li>
                <li><a href="index.html#why" class="nav__link" data-spy="why" data-i18n="nav.about">About us</a></li>
                <li><a href="catalog.html" class="nav__link" data-i18n="nav.list">Property List</a></li>
                <li><a href="#contact" class="nav__link" data-spy="contact" data-i18n="nav.contact">Contact us</a></li>
            </ul>
            <div class="nav__right">
                <div class="lang" id="lang">
                    <button class="lang__btn" type="button" aria-haspopup="true">
                        <span class="icon icon--globe"></span>
                        <span data-i18n="lang.short">Eng</span>
                        <span class="icon icon--chevron"></span>
                    </button>
                      <ul class="lang__menu">
                         <li><button type="button" data-lang="en">English</button></li>
                         <li><button type="button" data-lang="de">Deutsch</button></li>
                      </ul>
                </div>
                <a href="#" class="btn btn--dark btn--sm" data-i18n="nav.signup">Sign up</a>
                <button class="nav__burger" id="burger" type="button" aria-label="Menu"><span></span></button>
            </div>
        </nav>

        <header class="hero" id="top">
        <div class="hero__bg"></div>
        <div class="hero__watermark" data-i18n="hero.mark">Build</div>

        <div class="hero__content">
            <h1 class="hero__title">
                <span class="line"><span data-i18n="hero.title1">Build Your</span></span>
                <span class="line"><span data-i18n="hero.title2">Future</span></span>
            </h1>
            <p class="hero__text" data-i18n="hero.text">Find your dream home with our premium properties, designed for
                modern living and a better tomorrow.</p>
            <a href="catalog.html" class="btn btn--dark hero__btn">
                <span data-i18n="hero.btn">Explore Properties</span>
                <span class="icon icon--arrow"></span>
            </a>

            <div class="stats">
                <div class="stats__item"><strong data-count="100" data-suffix="%">100%</strong><span
                        data-i18n="stats.trusted">Trusted</span></div>
                <div class="stats__item"><strong data-count="500" data-suffix="+">500+</strong><span
                        data-i18n="stats.properties">Properties</span></div>
                <div class="stats__item"><strong data-count="150" data-suffix="+">150+</strong><span
                        data-i18n="stats.agents">Agents</span></div>
                <div class="stats__item"><strong data-count="12" data-suffix="+">12+</strong><span
                        data-i18n="stats.years">Years Experience</span></div>
            </div>
        </div>

        <a href="#" class="hero__play">
            <span class="hero__play-btn"><span class="icon icon--play"></span></span>
            <span class="hero__play-text" data-i18n-html="hero.play">One Property<br>at a Time</span>
        </a>
    </header>
    
    </div>
</body>

</html>
